[alembic]
# 迁移脚本存放目录
script_location = alembic

# SQLAlchemy URL — 这里用 MySQL 的 URL，因为业务数据在 MySQL
# Alembic 主要用于业务表的迁移，PostgreSQL 向量表迁移也类似配置
sqlalchemy.url = mysql+pymysql://root:@localhost/ai_kb_platform?charset=utf8mb4

# 日志格式
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
