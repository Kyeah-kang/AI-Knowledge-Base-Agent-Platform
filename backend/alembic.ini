# NOTE: keep this file ASCII-only.
# configparser (used by Alembic) decodes with the *locale* encoding on Windows
# (GBK on zh-CN), so UTF-8 comments here crash with UnicodeDecodeError.
# Chinese notes live in docs/ARCHITECTURE.md and alembic/env.py instead.

[alembic]
# Default target: MySQL (business data)
#   alembic upgrade head                 -> MySQL
#   alembic -n postgres upgrade head     -> PostgreSQL (vector data)
script_location = alembic
prepend_sys_path = .
version_locations = alembic/versions_mysql

# Real URLs come from app.core.config (settings.ASYNC_MYSQL_URL / POSTGRES_URL).
# This placeholder is only here to satisfy Alembic's template expectations.
# Set ALEMBIC_DATABASE_URL to override (CI / dry-run against a scratch DB).
sqlalchemy.url = driver://user:pass@localhost/dbname

[postgres]
# Alembic does NOT inherit [alembic] for script_location / prepend_sys_path,
# so they must be repeated here.
script_location = alembic
prepend_sys_path = .
version_locations = alembic/versions_pg
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
